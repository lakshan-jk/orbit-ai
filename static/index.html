<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse 🫀</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --me:#2563eb; --bot:#242836; --text:#e6e8ee; --muted:#8b90a0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text);
         height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 20px; font-size:20px; font-weight:700; border-bottom:1px solid #222634; }
  header small { color:var(--muted); font-weight:400; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:72%; padding:11px 15px; border-radius:14px; line-height:1.45; white-space:pre-wrap; }
  .me  { align-self:flex-end;   background:var(--me);  border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid #222634; background:var(--panel); }
  input { flex:1; padding:13px 16px; font-size:15px; border:1px solid #2a2f3e; border-radius:10px;
          background:#0f1117; color:var(--text); outline:none; }
  input:focus { border-color:var(--me); }
  button { padding:13px 22px; font-size:15px; font-weight:600; border:0; border-radius:10px;
           background:var(--me); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
  <header>Pulse 🫀 <small>· local AI chat (llama3.2)</small></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask Pulse anything…" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

<script>
const chat  = document.getElementById('chat');
const form  = document.getElementById('form');
const input = document.getElementById('input');
const send  = document.getElementById('send');

// Add a bubble to the chat window and return the element (so we can edit it later).
function bubble(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;  // always scroll to newest
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();                       // don't reload the page
  const text = input.value.trim();
  if (!text) return;

  bubble(text, 'me');                       // show my message
  input.value = '';
  send.disabled = true;
  const thinking = bubble('Pulse is thinking…', 'bot');
  thinking.classList.add('typing');

  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    thinking.classList.remove('typing');
    thinking.textContent = data.reply;      // replace "thinking…" with the real reply
  } catch (err) {
    thinking.classList.remove('typing');
    thinking.textContent = '⚠️ Error: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
