# Orbit, fully containerised: Postgres + FastAPI backend + Next.js frontend.
# Ollama (the model) runs on the HOST — the backend reaches it via
# host.docker.internal. Start it first: `ollama serve` with llama3.2 pulled.
#
#   docker compose up --build
#   → open http://localhost:3000

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    environment:
      ORBIT_DATABASE_URL: postgresql+asyncpg://orbit:orbit@db:5432/orbit
      ORBIT_OLLAMA_URL: http://host.docker.internal:11434/api/chat
      ORBIT_JWT_SECRET: ${ORBIT_JWT_SECRET:-dev-secret-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach host Ollama on Linux
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8100"

  web:
    build:
      context: ./web
    environment:
      BACKEND_URL: http://backend:8100 # the proxy target inside the compose network
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
